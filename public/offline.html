<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>내 자료실 | 오프라인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
    h1 { font-size: 28px; }
    p { line-height: 1.7; color: #c9d6e6; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>내 자료실은 메모를 기기에 저장하지 않습니다. 인터넷에 다시 연결한 뒤 새로고침하면 서버가 로그인과 기기 승인을 다시 확인하고 자료를 보여 줍니다.</p>
    <p>앱을 설치했다는 사실만으로 기기 승인이 끝난 것은 아닙니다.</p>
  </main>
</body>
</html>
